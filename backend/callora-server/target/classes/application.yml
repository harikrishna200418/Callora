server:
  port: 8080

spring:
  application:
    name: callora-server

  # Default profile uses H2 for easy local development
  datasource:
    url: jdbc:h2:file:./data/callora;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# JWT Configuration
callora:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWtleS1mb3ItY2FsbG9yYS1hcHAtZGV2ZWxvcG1lbnQtb25seS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==}
    access-token-expiry: 3600000      # 1 hour
    refresh-token-expiry: 2592000000  # 30 days

  otp:
    length: 6
    expiry-minutes: 5

  media:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 52428800  # 50MB

  battery:
    default-warning-threshold: 10
    default-critical-threshold: 7
    min-allowed-threshold: 3

logging:
  level:
    com.callora: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:callora}
    username: ${DB_USERNAME:callora}
    password: ${DB_PASSWORD:callora}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    locations: classpath:db/migration/postgresql
