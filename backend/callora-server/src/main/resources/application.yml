server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: callora-server

  # MySQL 8 — dev profile (local)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:callora}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:22701a560}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: CHAR
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # OAuth2 — set real credentials via env vars
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope: openid, profile, email

# JWT Configuration — never fallback in prod
callora:
  jwt:
    secret: ${JWT_SECRET:Y2FsbG9yYS1kZXYtc2VjcmV0LWtleS1taW5pbXVtLTUxMi1iaXRzLWZvci1IUzUxMi1hbGdvcml0aG0tMTIzNDU2}
    access-token-expiry: 900000       # 15 minutes
    refresh-token-expiry: 604800000   # 7 days

  otp:
    length: 6
    expiry-minutes: 5

  oauth2:
    frontend-redirect-url: ${FRONTEND_URL:http://localhost:5173}/oauth/callback

  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

  media:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 52428800  # 50MB

  battery:
    default-warning-threshold: 10
    default-critical-threshold: 7
    min-allowed-threshold: 3

# Actuator — health only public, full access internal
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.callora: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

---
# Production profile — ALL secrets must come from env vars
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    locations: classpath:db/migration

logging:
  level:
    com.callora: WARN
    org.springframework: WARN
